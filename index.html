<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Analyzer</title>
<link rel="icon" href="data:,">
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem("theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch { }
</script>
<style>
  :root {
    --bg:     #fff;
    --text:   #1f2328;
    --muted:  #6e7781;
    --border: #d0d7de;
    --faint:  #f6f8fa;
    --accent: #2a78d6;
    --accent-hover: #1f64b8;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg:     #0d1117;
    --text:   #e6edf3;
    --muted:  #8d96a0;
    --border: #30363d;
    --faint:  #161b22;
    --accent: #4493f8;
    --accent-hover: #6ca4f8;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.5;
    padding: 2rem 1rem;
  }

  .container { max-width: 1150px; margin: 0 auto; }

  /* Input on the left, dimension profile on the right; stacked on narrow screens. */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 1.5rem;
    align-items: stretch;
  }
  .input-col { display: flex; flex-direction: column; }
  .input-col textarea { flex: 1; }
  @media (max-width: 900px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
  }

  header { margin-bottom: 1.5rem; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }

  #theme-toggle { display: flex; padding: 0.4rem; }
  #theme-toggle svg {
    width: 1.1rem; height: 1.1rem;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-sun, [data-theme="dark"] .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }
  h1 { font-size: 1.25rem; font-weight: 600; }
  header p, .note { color: var(--muted); font-size: 0.85rem; }

  h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 2rem 0 0.6rem;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--muted); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.6rem;
  }

  button {
    padding: 0.4rem 1rem;
    background: var(--faint);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { color: var(--muted); cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.primary:disabled { opacity: 0.6; }

  label { color: var(--muted); font-size: 0.8rem; }
  select {
    margin-left: 0.35rem;
    padding: 0.35rem 0.5rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 0.8rem;
  }
  select:hover { border-color: var(--muted); }
  select:disabled { color: var(--muted); }

  #status { color: var(--muted); font-size: 0.8rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 0.35rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 0.3rem 0.5rem;
    border-bottom: 1px solid var(--faint);
  }
  tr:hover td { background: var(--faint); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .code, .parse td { font-family: var(--font-mono); font-size: 0.8rem; }
  .code { color: var(--muted); width: 3.5rem; }
  .zero td { color: var(--muted); }

  details {
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 0.5rem;
  }
  summary {
    cursor: pointer;
    padding: 0.45rem 0.75rem;
    font-size: 0.85rem;
  }
  details[open] summary { border-bottom: 1px solid var(--border); }
  details table { margin: 0.25rem 0; }

  .profile { position: relative; }
  .profile-heading h2 { margin: 0; }
  .profile .note { margin-top: 0.25rem; }
  .profile details { margin-top: 0.6rem; }
  .radar { position: relative; margin-top: 0.5rem; }

  .error {
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    border-radius: 6px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <h1>Biber features</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
    <p>Biber Multidimensional Linguistic analysis, fully in your browser.</p>
    <p>Fine-tuned Google's Electra (SLM) as encoder + biaffine parser & tagger running on Onnx runtime.</p>
  </header>

  <div class="workspace">
    <div class="input-col">
      <textarea id="input" placeholder="Paste a text here and click Analyze…

The scientists who discovered the vaccine won the Nobel Prize. She had already published her findings in three peer-reviewed journals."></textarea>
      <div class="toolbar">
        <button id="parseBtn" class="primary">Analyze</button>
        <label>Workers<select id="workers" title="Parallel workers. Each holds its own copy of the model, so more workers are faster but use more memory."></select></label>
        <span id="status"></span>
      </div>
    </div>
    <aside id="profile" class="profile" aria-live="polite"></aside>
  </div>

  <div id="results"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
